[tool.poetry]
name = "ai-agent-service"
version = "0.1.0"
description = "AI Agent Service - LLM-powered autonomous PLC parameter optimisation"
authors = ["Gimhana UAK <ms25915440@my.sliit.lk>"]

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
fastapi = "0.109.0"
uvicorn = {extras = ["standard"], version = ">=0.27.0"}
pydantic = ">=2.5.0"
pydantic-settings = ">=2.1.0"
sqlalchemy = {extras = ["asyncio"], version = ">=2.0.25"}
asyncpg = ">=0.29.0"
loguru = ">=0.7.2"
httpx = ">=0.27.0"
redis = {extras = ["hiredis"], version = ">=5.0.0"}
anthropic = ">=0.40.0"
numpy = ">=1.26.0"
aio-pika = ">=9.0.0"

[tool.poetry.dev-dependencies]
pytest = ">=7.0.0"
pytest-asyncio = ">=0.23.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
